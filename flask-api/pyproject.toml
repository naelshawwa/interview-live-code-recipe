[tool.poetry]
name = "flask-api"
version = "0.1.0"
description = "Flask REST API"
authors = ["nael@sequellabs.io"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
flask = "^2.3.0"
flask-cors = "^4.0.0"
python-dotenv = "^1.0.0"
requests = "^2.31.0"
pydantic = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"